spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/energia_consciente}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
      schema-locations: classpath:db/mysql-schema.sql
